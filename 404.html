<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Pulse.?</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pulse-orange: #C34E0A;
            --bg: #000000;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            color: var(--pulse-orange);
            letter-spacing: 10px;
        }

        p {
            letter-spacing: 2px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .back-home {
            text-decoration: none;
            color: white;
            border: 1px solid var(--pulse-orange);
            padding: 12px 30px;
            transition: 0.3s;
            font-size: 0.8rem;
        }

        .back-home:hover {
            background: var(--pulse-orange);
            box-shadow: 0 0 20px var(--pulse-orange);
        }
    </style>
</head>
<body>

    <h1>404</h1>
    <p>Got lost? This page does not exist.</p>
    <a href="https://www.pulseraves.ch" class="back-home">RETURN TO PULSE.</a>

</body>
</html>
