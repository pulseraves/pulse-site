<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline'; img-src 'self' data: https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse.</title>
    <link rel="icon" type="image/png" href="/Logo_nobackground.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pulse-orange: #C34E0A;
            --bg: #000000;
            --text: #FFFFFF;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url("/Our Vision.jpg") no-repeat center center;
            background-size: cover;
            filter: brightness(0.6); 
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            color: var(--pulse-orange);
            font-size: clamp(3rem, 12vw, 8rem);
            text-transform: none;
            letter-spacing: 0.03em;
            margin: 10px 0;
        }

        .next-event { 
            margin-top: 20px;
            margin-bottom: 20px;
            display: inline-block;
            width: auto; 
            border: 1px solid var(--pulse-orange); 
            padding: 10px 25px; 
            color: var(--text); 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            animation: blink 2s infinite; 
        }

        @keyframes blink { 50% { opacity: 0.3; }}

        .main-logo {
            width: clamp(200px, 20vh, 320px);
            height: auto;
            margin-top: 1vh;
            margin-bottom: 1vh;
            animation: pulse-dime 4s infinite ease-in-out;
            filter: contrast(1.1) brightness(1.1);
        }

        @keyframes pulse-dime {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        nav {
            position: absolute;
            top: 40px;
            left: 75%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 100;
        }

        nav a {
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: none;
            transition: 0.3s;
            border: 1px solid #333;
            padding: 8px 15px;
        }

        nav a:hover {
            color: var(--pulse-orange);
            border-color: var(--pulse-orange);
            background: rgba(195, 78, 10, 0.05);
        }

        .header {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        footer {
            margin-top: auto;
            width: 100%;
            padding-bottom: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 40px;
            background: linear-gradient(to top, rgba (0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        footer a {
            color: var(--pulse-orange);
            text-decoration: none;
            transition: 0.3s;
        }

        footer a:hover {
            color: #fff;
        }

        .footer-contact {
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #888;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-links a {
            text-decoration: none;
            color: var(--pulse-orange);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: white;
            text-shadow: 0 0 10px var(--pulse-orange);
        }

        .copyright {
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            body {
                justify-content: flex-start;
                padding-top: 80px;
            }

            body::before {
                height: 100%;
                background-attachment: scroll;
            }

            nav { left: 50%; top: 20px; }
            .main-logo { width: 220px; }
            h1 { font-size: 2.5rem; }
            
            .next-event {
                margin-top: 20px;
                margin-bottom: 40px;
                width: 90%;
                font-size: 0.8rem;
            }

            footer {
                margin-top: 20px;
            }

            .social-links {
                gap: 15px;
                flex-wrap: wrap;
            }
            
            .social-links a {
                font-size: 0.65rem;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <nav>
            <a href="/archive/">Archive</a>
        </nav>
        
        <img src="Logo_nobackground.png" alt="Pulse Logo" class="main-logo">
        <h1>Pulse.</h1>
        <div class="next-event">Pulse. #2: announcement very soon</div>
    </div> 

    <footer>
        <div class="footer-contact">
            FOR BOOKINGS OR INQUIRIES: <a href="mailto:info@pulseraves.ch">info@pulseraves.ch</a>
        </div>
        
        <div class="social-links">
            <a href="https://instagram.com/pulse.ravesss" target="_blank">INSTAGRAM</a>
            <a href="https://www.tiktok.com/@pulse.raves" target="_blank">TIKTOK</a>
            <a href="https://www.youtube.com/@pulse.ravesss" target="_blank">YOUTUBE</a>
        </div>

        <p class="copyright">&copy; 2026 Pulse. KLG ALL RIGHTS RESERVED.</p>
    </footer>
</body>
</html>
