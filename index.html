<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline'; img-src 'self' data: https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse.</title>
    <link rel="icon" type="image/png" href="/Logo_nobackground.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pulse-blue: #2380D0;
            --bg: #000000;
            --text: #FFFFFF;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
            text-align: center;
        }

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url("/Our Vision.webp?v=2") no-repeat center center;
            background-size: cover;
            filter: brightness(0.6) blur(0px); 
            z-index: -1;
            pointer-events: none;
            transition: filter 0.5s ease-out;
        }

        .menu-icon {
            position: absolute;
            top: 40px;
            right: 40px;
            cursor: pointer;
            z-index: 2001;
            padding: 10px;
        }

        .menu-icon div {
            width: 25px;
            height: 2px;
            background-color: white;
            margin: 6px 0;
            transition: 0.4s;
        }

        .change .bar1 { transform: rotate(-45deg) translate(-5px, 6px); }
        .change .bar2 { opacity: 0; }
        .change .bar3 { transform: rotate(45deg) translate(-5px, -6px); }

        .side-menu {
            height: 100dvh;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(15px);
            overflow-x: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-left: 1px solid rgba(35, 128, 208, 0.3); 
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 15vh;
            padding-left: 10%;
            padding-right: 5%;
            gap: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .side-menu a {
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            color: white;
            letter-spacing: 5px;
            transition: 0.3s;
            white-space: nowrap;
            text-align: left;
            width: 100%;
        }

        .side-menu a:hover {
            color: var(--pulse-blue);
        }

        .header {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            color: var(--pulse-blue);
            font-size: clamp(3rem, 12vw, 8rem);
            text-transform: none;
            letter-spacing: 0.03em;
            margin: 10px 0;
            display: inline-block;
            animation: textPulse 4s infinite ease-in-out;
            animation-delay: 0.5s; 
        }

        .main-logo {
            width: clamp(200px, 20vh, 320px);
            height: auto;
            margin-top: 1vh;
            margin-bottom: 1vh;
            filter: contrast(1.1) brightness(1.1);
            animation: logoPulse 4s infinite ease-in-out;
        }

        .next-event { 
            margin-top: 20px;
            margin-bottom: 20px;
            display: inline-block;
            width: auto; 
            border: 1px solid var(--pulse-blue); 
            padding: 10px 25px; 
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes logoPulse {
            0% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(1); opacity: 0.85; }
        }

        @keyframes textPulse {
            0% { transform: scale(1); opacity: 0.85; text-shadow: 0 0 5px var(--pulse-blue); }
            50% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 15px var(--pulse-blue); }
            100% { transform: scale(1); opacity: 0.85; text-shadow: 0 0 5px var(--pulse-blue); }
        }

        footer {
            margin-top: auto;
            width: 100%;
            padding-bottom: 20px;
            text-align: center;
            padding-top: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        footer a { color: var(--pulse-blue); text-decoration: none; transition: 0.3s; font-weight: 600; }
        footer a:hover { color: #fff; }
        .footer-contact { font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 25px; color: #888; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .social-links a { text-decoration: none; color: var(--pulse-blue); font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; transition: 0.3s; }
        .social-links a:hover { color: white; text-shadow: 0 0 10px var(--pulse-blue); }
        .copyright { font-size: 0.55rem; color: #666; letter-spacing: 1px; }

        @media (max-width: 600px) {
            body { justify-content: space-between; padding: 20px 0; height: 100dvh; box-sizing: border-box; }
            #bg-image { height: 100%; background-attachment: scroll; }
            .menu-icon { top: 20px; right: 20px; }
            .side-menu { border-left: none; }
            .menu-content { align-items: flex-start; padding-top: 15vh; padding-left: 12%; padding-right: 5%; width: 100%; box-sizing: border-box; }
            .header { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; margin-top: -20px; }
            .main-logo { width: 200px; margin-bottom: 0; }
            h1 { font-size: 4.2rem; margin: 0; line-height: 1.1; width: 100%; }
            .next-event { margin-top: 20px; width: 85%; font-size: 0.65rem; box-sizing: border-box; }
            .side-menu a { font-size: 1.5rem; text-align: left; width: 100%; }
            footer { margin-top: auto; padding-bottom: env(safe-area-inset-bottom, 15px); display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
            .footer-contact, .social-links { margin: 0; }
            .social-links { gap: 25px; }
            .copyright { font-size: 0.55rem; color: #888; letter-spacing: 1px; margin-top: -5px; margin-bottom: 5px; }
        }
    </style>
</head>

<body>

    <div id="bg-image"></div>

    <div class="menu-icon" onclick="toggleMenu(this)">
        <div class="bar1"></div>
        <div class="bar2"></div>
        <div class="bar3"></div>
    </div>

    <nav id="sideMenu" class="side-menu">
        <div class="menu-content">
            <a href="/photobook/" onclick="toggleMenu()">Photobook</a>
            <a href="/vision/" onclick="toggleMenu()">Vision</a>
            <a href="/sets/" onclick="toggleMenu()">DJ Sets</a>
        </div>
    </nav>

    <div class="header">
        <img src="Logo_nobackground.png" alt="Pulse Logo" class="main-logo">
        <h1>Pulse.</h1>
        <div class="next-event">Pulse. #2: 1st Artist Reveal & Ticket drop &bull; March 1st &bull; 18:00</div>
    </div> 

    <footer>
        <div class="footer-contact">
            FOR BOOKINGS OR INQUIRIES: <a href="mailto:info@pulseraves.ch">info@pulseraves.ch</a>
        </div>
        
        <div class="social-links">
            <a href="https://instagram.com/pulse.ravesss" target="_blank">INSTAGRAM</a>
            <a href="https://www.tiktok.com/@pulse.raves" target="_blank">TIKTOK</a>
            <a href="https://www.youtube.com/@pulse.ravesss" target="_blank">YOUTUBE</a>
        </div>

        <p class="copyright">&copy; 2026 Pulse. KLG ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        function toggleMenu(x) {
            const icon = x || document.querySelector('.menu-icon');
            icon.classList.toggle("change");
            
            const menu = document.getElementById("sideMenu");
            const isMobile = window.innerWidth <= 600;
            const targetWidth = isMobile ? "100%" : "30%";

            if (!menu.style.width || menu.style.width === "0px" || menu.style.width === "0%") {
                menu.style.width = targetWidth;
            } else {
                menu.style.width = "0%";
            }
        }

        const bg = document.getElementById('bg-image');
        let blurTimeout;

        function applyBlur() {
            bg.style.filter = "brightness(0.6) blur(4px)";
            clearTimeout(blurTimeout);
            blurTimeout = setTimeout(() => {
                bg.style.filter = "brightness(0.6) blur(0px)";
            }, 500);
        }

        window.addEventListener('mousemove', applyBlur);
        window.addEventListener('touchstart', applyBlur);
    </script>
</body>
</html>
