<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline'; img-src 'self' data: https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse.</title>
    <link rel="icon" type="image/png" href="/Logo_nobackground.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pulse-blue: #2380D0;
            --bg: #000000;
            --text: #FFFFFF;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
            text-align: center;
        }

        #bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url("/Our Vision.webp?v=2") no-repeat center center;
            background-size: cover;
            filter: brightness(0.6) blur(0px); 
            z-index: -1;
            pointer-events: none;
            transition: filter 0.5s ease-out;
        }

        .menu-icon { position: absolute; top: 40px; right: 40px; cursor: pointer; z-index: 2001; padding: 10px; }
        .menu-icon div { width: 25px; height: 2px; background-color: white; margin: 6px 0; transition: 0.4s; }
        .change .bar1 { transform: rotate(-45deg) translate(-5px, 6px); background-color: var(--pulse-blue); }
        .change .bar2 { opacity: 0; }
        .change .bar3 { transform: rotate(45deg) translate(-5px, -6px); background-color: var(--pulse-blue);}
        .change div { box-shadow: 0 0 8px var(--pulse-blue); }

        .side-menu {
            height: 100dvh; width: 0; position: fixed; z-index: 2000;
            top: 0; right: 0; background-color: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(15px); overflow-x: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; border-left: 1px solid rgba(35, 128, 208, 0.3); 
        }

        .menu-content { display: flex; flex-direction: column; padding-top: 15vh; padding-left: 10%; gap: 40px; box-sizing: border-box; width: 100%; align-items: flex-start; }
        .side-menu a { 
            font-family: 'Orbitron', sans-serif; 
            text-decoration: none; 
            font-size: clamp(1.2rem, 2.5vw, 1.8rem); 
            color: white; 
            letter-spacing: 5px; 
            transition: 0.3s;
            text-align: left;
            display: block;
            width: fit-content;
        }
        .side-menu a:hover { color: var(--pulse-blue); text-shadow: 0 0 10px rgba(35, 128, 208, 0.5); }
        .active-link { color: var(--pulse-blue) !important; border-bottom: 1px solid var(--pulse-blue); padding-bottom: 5px; }

        .header { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--pulse-blue); font-size: clamp(3rem, 12vw, 8rem); margin: 0px 0 10px 0; animation: textPulse 4s infinite ease-in-out; }
        .main-logo { width: clamp(200px, 20vh, 320px); height: auto; filter: contrast(1.1) brightness(1.1); animation: logoPulse 4s infinite ease-in-out; margin-bottom: -10px;}

        .next-event { 
            margin-top: 15px; margin-bottom: 15px; display: inline-flex;
            flex-direction: column; align-items: center; gap: 8px;
            border: 1px solid var(--pulse-blue); padding: 20px 40px;
            font-family: 'Orbitron', sans-serif; text-transform: uppercase;
            background: rgba(35, 128, 208, 0.05);
            box-shadow: 0 0 15px rgba(35, 128, 208, 0.2), inset 0 0 10px rgba(35, 128, 208, 0.1);
        }

        #countdown-container, .lineup-section {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .reveal-label { font-size: 0.75em; opacity: 0.8; letter-spacing: 2px; }
        .blue-text { color: var(--pulse-blue); font-weight: 600; }

        .reveal-time, #countdown {
            font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 600; color: #FFFFFF;
            text-shadow: 0 0 10px var(--pulse-blue), 0 0 20px var(--pulse-blue);
            letter-spacing: 4px;
        }

        #lineup-reveal-container {
            display: none;
            flex-direction: column; align-items: center; width: 100%;
            margin-top: 10px; padding-top: 15px;
            border-top: 1px solid rgba(35, 128, 208, 0.3);
            gap: 15px;
        }

        .ticket-link {
            text-decoration: none; color: white; border: 1px solid white;
            padding: 10px 25px; font-size: 0.8rem; transition: 0.3s; 
            background: rgba(35, 128, 208, 0.15); letter-spacing: 2px;
        }
        .ticket-link:hover { background: var(--pulse-blue); box-shadow: 0 0 20px var(--pulse-blue); border-color: var(--pulse-blue); }

        footer { margin-top: auto; width: 100%; padding-bottom: 20px; text-align: center; padding-top: 40px; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); }
        footer a { color: var(--pulse-blue); text-decoration: none; font-weight: 600; }
        .footer-contact { font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 25px; color: #888; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .social-links a { text-decoration: none; color: var(--pulse-blue); font-size: 0.75rem; letter-spacing: 2px; }
        .copyright { font-size: 0.55rem; color: #666; letter-spacing: 1px; }

        @keyframes logoPulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.04); opacity: 1; } }
        @keyframes textPulse { 0%, 100% { transform: scale(1); opacity: 0.85; text-shadow: 0 0 5px var(--pulse-blue); } 50% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 15px var(--pulse-blue); } }

        @media (max-width: 600px) {
            .next-event { width: 90%; padding: 20px 15px; gap: 10px; }
            h1 { font-size: 4.2rem; margin-top: 0; margin-bottom: 5px;}
            .main-logo { width: 200px; }
            .reveal-time, #countdown { font-size: 1.1rem; letter-spacing: 2px; }
        }
    </style>
</head>

<body>
    <div id="bg-image"></div>

    <div class="menu-icon" onclick="toggleMenu(this)">
        <div class="bar1"></div><div class="bar2"></div><div class="bar3"></div>
    </div>

    <nav id="sideMenu" class="side-menu">
        <div class="menu-content">
            <a href="/" class="active-link" onclick="toggleMenu()">Home</a>
            <a href="/photobook/" onclick="toggleMenu()">Photobook</a>
            <a href="/vision/" onclick="toggleMenu()">Vision</a>
            <a href="/sets/" onclick="toggleMenu()">DJ Sets</a>
        </div>
    </nav>

    <div class="header">
        <img src="Logo_nobackground_blue.png" alt="Pulse Logo" class="main-logo">
        <h1>Pulse.</h1>
        
        <div class="next-event">
            <div id="countdown-container">
                <span class="reveal-label">
                    <span class="blue-text">Pulse. #2:</span> 
                    <span id="countdown-task">1st Artist Reveal In:</span>
                </span>
                <span id="countdown">Loading...</span>
            </div>

            <div id="lineup-reveal-container">
                <div class="lineup-section">
                    <span class="reveal-label"><span class="blue-text">Line-up:</span></span>
                    <span class="reveal-time">xxx</span>
                </div>
                <a href="https://eventfrog.ch/your-link" class="ticket-link" target="_blank">GET TICKETS</a>
            </div>
        </div>
    </div> 

    <footer>
        <div class="footer-contact">FOR BOOKINGS OR INQUIRIES: <a href="mailto:info@pulseraves.ch">info@pulseraves.ch</a></div>
        <div class="social-links">
            <a href="https://instagram.com/pulse.ravesss" target="_blank">INSTAGRAM</a>
            <a href="https://www.tiktok.com/@pulse.raves" target="_blank">TIKTOK</a>
            <a href="https://www.youtube.com/@pulse.ravesss" target="_blank">YOUTUBE</a>
        </div>
        <p class="copyright">&copy; 2026 Pulse. KLG ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        function toggleMenu(x) {
            const menu = document.getElementById("sideMenu");
            const icon = x || document.querySelector('.menu-icon');
            icon.classList.toggle("change");
            const isMobile = window.innerWidth <= 600;
            menu.style.width = (menu.style.width === "100%" || menu.style.width === "30%") ? "0" : (isMobile ? "100%" : "30%");
        }

        const ticketDate = new Date("March 1, 2026 18:00:00").getTime();
        const secondArtistDate = new Date("March 8, 2026 18:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            let target, taskText;

            if (now < ticketDate) {
                target = ticketDate;
                taskText = "1st Artist & Ticket Drop In:";
            } else {
                target = secondArtistDate;
                taskText = "2nd Artist Reveal In:";
                document.getElementById("lineup-reveal-container").style.display = "flex";
            }

            const distance = target - now;

            if (distance < 0 && now > secondArtistDate) {
                clearInterval(timer);
                document.getElementById("countdown-container").style.display = "none";
            } else {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("countdown-task").innerText = taskText;
                document.getElementById("countdown").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
            }
        }, 1000);

        const bg = document.getElementById('bg-image');
        let blurTimeout;
        function applyBlur() {
            bg.style.filter = "brightness(0.6) blur(4px)";
            clearTimeout(blurTimeout);
            blurTimeout = setTimeout(() => { bg.style.filter = "brightness(0.6) blur(0px)"; }, 500);
        }
        window.addEventListener('mousemove', applyBlur);
        window.addEventListener('touchstart', applyBlur);
    </script>
</body>
</html>
