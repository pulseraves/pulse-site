<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse.</title>
    <link rel="icon" type="image/png" href="Logo_nobackground.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pulse-orange: #C34E0A;
            --bg: #000000;
            --text: #FFFFFF;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            font-family: sans-serif; 
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            color: var(--pulse-orange);
            font-size: clamp(3rem, 12vw, 8rem);
            text-transform: none;
            letter-spacing: 0.03em;
            margin: 0;
        }
        .next-event { 
            margin-top: 20px; 
            border: 1px solid var(--pulse-orange); 
            padding: 10px 20px; 
            color: var(--text); 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            animation: blink 2s infinite; 
        }

        @keyframes blink { 50% { opacity: 0.3; }}

        .main-logo {
            width: 320px;
            height: auto;
            margin-bottom: 10px;
            animation: pulse-dime 4s infinite ease-in-out;
            filter: contrast(1.1) brightness(1.1);
        }

        @keyframes pulse-dime {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        nav {
            position: absolute;
            top: 40px;
            left: 75%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 100;
        }

        nav a {
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: none;
            transition: 0.3s;

            border: 1px solid #333;
            padding: 8px 15px;
        }

        nav a:hover {
            color: var(--pulse-orange);
            border-color: var(--pulse-orange);
            background: rgba(195, 78, 10, 0.05);
        }

        .header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: #555;
            z-index: 10;
            letter-spacing: 1px;
        }
        footer a {
            color: var(--pulse-orange);
            text-decoration: none;
            transition: 0.3s;
        }

        footer a:hover {
            color: #fff;
        }

        .footer-contact {
            margin-bottom: 10px;
            color: #bbb;
        }

        @media (max-width: 600px) {
            nav {left: 50%; top: 20px; }
            .main-logo { width: 220px; }
            h1 { font-size: 2.5rem; }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(20, 20, 20, 0.4), rgba(0, 0, 0, 0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
            filter: contrast(150%) brightness(100%);
            opacity: 0.7;
            pointer-events: none;
            z-index: -1;
        }

        footer {
            margin-top: 80px;
            padding-bottom: 40px;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 40px;
        }

        .footer-contact {
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #888;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-links a {
            text-decoration: none;
            color: var(--pulse-orange);
            font-size: 0.75rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: white;
            text-shadow: 0 0 10px var(--pulse-orange);
        }

        .copyright {
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .social-links {
                gap: 15px;
                flex-wrap: wrap;
            }
            .social-links a {
                font-size: 0.65rem;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <nav>
            <a href="archive.html">Archive</a>
        </nav>
        
        <img src="Logo_nobackground.png" alt="Pulse Logo" class="main-logo">
        <h1>Pulse.</h1>
        <div class="next-event">Pulse. #2: announcement very soon</div>

        <footer>
            <div class="footer-contact">
                FOR BOOKINGS OR INQUIRIES: <a href="mailto:info@pulseraves.ch">info@pulseraves.ch</a>
            </div>
    
            <div class="social-links">
                <a href="https://instagram.com/pulse.ravesss" target="_blank">INSTAGRAM</a>
                <a href="https://www.tiktok.com/@pulse.raves" target="_blank">TIKTOK</a>
                <a href="https://www.youtube.com/@pulse.ravesss" target="_blank">YOUTUBE</a>
            </div>

            <p class="copyright">&copy; 2026 Pulse. KLG ALL RIGHTS RESERVED.</p>
        </footer>
    </div>

</body>

</html>
